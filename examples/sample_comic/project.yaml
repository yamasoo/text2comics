# 漫畫專案設定（範例）。格式說明見 docs/02_資料格式.md。
title: 屋頂的便當
language: zh-TW
reading: rtl                 # 日式右翻：格子由右到左、由上到下
style: >-
  Black and white Japanese manga artwork, clean confident ink lineart,
  screentone shading, high contrast, no color
meta: [manga panel, black and white, screentone]
megapixels: 1.0              # 每格生圖約 1 MP（MOSS 建議 1–2 MP）
negative: nsfw, worst quality, bad anatomy, watermark, jpeg artifact, text, speech bubble, letters
sfx_mode: overlay            # overlay＝狀聲詞也由嵌字程式疊上；moss＝交給 MOSS 畫
candidates: 3                # 每格產生幾張候選（S1 實測：2 個常有 1 個不能用，建議 3）
seed_base: 0
