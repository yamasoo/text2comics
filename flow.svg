<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="從小說到一頁漫畫的流程">
  <title>從小說到一頁漫畫的流程</title>
  <style>
    .box { rx: 10; ry: 10; stroke-width: 2; }
    .t { font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; font-size: 19px; fill: #ffffff; font-weight: 700; text-anchor: middle; }
    .s { font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; font-size: 13px; fill: #ffffff; text-anchor: middle; opacity: .9; }
    .k { font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; font-size: 14px; fill: #4b5262; text-anchor: middle; }
    .you { fill: #8c5a2b; }
    .ai { fill: #2f5a7a; }
    .gpu { fill: #1f8a4c; }
    .tool { fill: #566072; }
    .arrow { stroke: #9aa1ad; stroke-width: 2.5; fill: none; marker-end: url(#head); }
    .legend { font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; font-size: 13px; fill: #4b5262; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa1ad"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="460" fill="#ffffff"/>

  <!-- 第一列：文字端 -->
  <rect class="box you" x="30" y="70" width="170" height="76"/>
  <text class="t" x="115" y="106">原著</text>
  <text class="s" x="115" y="128">你貼上或匯入整本</text>

  <rect class="box ai" x="240" y="70" width="170" height="76"/>
  <text class="t" x="325" y="106">切對話</text>
  <text class="s" x="325" y="128">場 → 旁白／對話</text>

  <rect class="box ai" x="450" y="70" width="170" height="76"/>
  <text class="t" x="535" y="106">改編規劃</text>
  <text class="s" x="535" y="128">每頁幾格、發生什麼</text>

  <rect class="box ai" x="660" y="70" width="170" height="76"/>
  <text class="t" x="745" y="106">漫畫劇本</text>
  <text class="s" x="745" y="128">台詞與節奏（可手改）</text>

  <rect class="box ai" x="870" y="70" width="170" height="76"/>
  <text class="t" x="955" y="106">分鏡</text>
  <text class="s" x="955" y="128">逐格的框、角色、台詞</text>

  <path class="arrow" d="M 200 108 L 238 108"/>
  <path class="arrow" d="M 410 108 L 448 108"/>
  <path class="arrow" d="M 620 108 L 658 108"/>
  <path class="arrow" d="M 830 108 L 868 108"/>

  <!-- 分鏡 → 出圖 -->
  <path class="arrow" d="M 955 146 L 955 196 L 250 196 L 250 236"/>

  <!-- 第二列：出圖與收尾 -->
  <rect class="box gpu" x="165" y="240" width="170" height="76"/>
  <text class="t" x="250" y="276">逐格出圖</text>
  <text class="s" x="250" y="298">ComfyUI＋MOSS-Image</text>

  <rect class="box you" x="375" y="240" width="170" height="76"/>
  <text class="t" x="460" y="276">挑圖／裁切</text>
  <text class="s" x="460" y="298">每格挑一張</text>

  <rect class="box tool" x="585" y="240" width="170" height="76"/>
  <text class="t" x="670" y="276">組版＋嵌字</text>
  <text class="s" x="670" y="298">程式的對話框與直排</text>

  <rect class="box tool" x="795" y="240" width="190" height="76"/>
  <text class="t" x="890" y="276">PDF／CBZ</text>
  <text class="s" x="890" y="298">右翻，整章或單頁</text>

  <path class="arrow" d="M 335 278 L 373 278"/>
  <path class="arrow" d="M 545 278 L 583 278"/>
  <path class="arrow" d="M 755 278 L 793 278"/>

  <!-- 視覺聖經：餵給出圖 -->
  <rect class="box ai" x="30" y="240" width="0" height="0"/>
  <rect class="box" x="30" y="352" width="305" height="72" fill="#2f5a7a"/>
  <text class="t" x="182" y="384">視覺聖經（角色與地點）</text>
  <text class="s" x="182" y="406">外觀分段、服裝、定裝圖</text>
  <path class="arrow" d="M 250 352 L 250 320"/>

  <text class="k" x="182" y="440">改了卡片 → 過期格清單 → 只重畫受影響的格</text>

  <!-- 圖例 -->
  <rect x="470" y="378" width="18" height="18" rx="4" fill="#8c5a2b"/>
  <text class="legend" x="496" y="392">你決定</text>
  <rect x="570" y="378" width="18" height="18" rx="4" fill="#2f5a7a"/>
  <text class="legend" x="596" y="392">AI 寫（DeepSeek／llama.cpp）</text>
  <rect x="830" y="378" width="18" height="18" rx="4" fill="#1f8a4c"/>
  <text class="legend" x="856" y="392">ComfyUI 出圖</text>
  <rect x="990" y="378" width="18" height="18" rx="4" fill="#566072"/>
  <text class="legend" x="1016" y="392">程式</text>
</svg>
